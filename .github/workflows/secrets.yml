name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required, not optional: gitleaks diffs a commit range, and a shallow
          # clone gives it nothing to diff against.
          fetch-depth: 0
      - name: Gitleaks
        # v3 needs a licence key for organization-owned repos only. This is a
        # personal account.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
